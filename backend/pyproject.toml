[project]
name = "rare-disease-atlas"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "networkx",
    "matplotlib",
    "scipy",
    "pyyaml",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
supabase = [
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
